<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://www.hamqth.com https://xmldata.qrz.com; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'">
  <title>HAM Logbook - 中继台</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
</head>
<body>

  <!-- 顶部标题栏 -->
  <div class="top-bar">
    <div class="top-bar-copy"><span class="top-brand">HAM LOGBOOK</span><h1>中继台</h1></div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题">☾</button>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- 内容区 -->
  <div class="content">

    <!-- 添加/编辑中继台表单 -->
    <div class="card" id="repeater-form">
      <div class="card-header">
        <span class="card-title">中继台信息</span>
      </div>
      <div class="card-content">
        <div class="field">
          <label for="repeater-name">名称 *</label>
          <input type="text" id="repeater-name" placeholder="例如 上海 70 cm 模拟中继" autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="repeater-rx">接收频率 (MHz) *</label>
            <input type="number" id="repeater-rx" step="0.001" inputmode="decimal" placeholder="439.650" min="0">
          </div>
          <div class="field">
            <label for="repeater-tx">发射频率 (MHz) *</label>
            <input type="number" id="repeater-tx" step="0.001" inputmode="decimal" placeholder="434.650" min="0">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="repeater-tx-tone">发射亚音 <span class="optional-note">可不填</span></label>
            <input type="text" id="repeater-tx-tone" list="tone-presets" placeholder="例 T88.5" autocomplete="off">
          </div>
          <div class="field">
            <label for="repeater-rx-tone">接收亚音 <span class="optional-note">可不填</span></label>
            <input type="text" id="repeater-rx-tone" list="tone-presets" placeholder="例 T88.5" autocomplete="off">
          </div>
        </div>
        <datalist id="tone-presets">
          <option value="T67.0"><option value="T69.3"><option value="T71.9"><option value="T74.4">
          <option value="T77.0"><option value="T79.7"><option value="T82.5"><option value="T85.4">
          <option value="T88.5"><option value="T91.5"><option value="T94.8"><option value="T97.4">
          <option value="T100.0"><option value="T103.5"><option value="T107.2"><option value="T110.9">
          <option value="T114.8"><option value="T118.8"><option value="T123.0"><option value="T127.3">
          <option value="T131.8"><option value="T136.5"><option value="T141.3"><option value="T146.2">
          <option value="T151.4"><option value="T156.7"><option value="T162.2"><option value="T167.9">
          <option value="T173.8"><option value="T179.9"><option value="T186.2"><option value="T192.8">
          <option value="T203.5"><option value="T210.7"><option value="T218.1"><option value="T225.7">
          <option value="T233.6"><option value="T241.8"><option value="T250.3"><option value="T254.1">
          <option value="D023N"><option value="D032N"><option value="D043N"><option value="D051N">
          <option value="D054N"><option value="D065N"><option value="D071N"><option value="D072N">
          <option value="D073N"><option value="D074N"><option value="D114N"><option value="D115N">
          <option value="D116N"><option value="D125N"><option value="D131N"><option value="D132N">
          <option value="D134N"><option value="D143N"><option value="D152N"><option value="D155N">
          <option value="D156N"><option value="D162N"><option value="D165N"><option value="D172N">
          <option value="D174N"><option value="D205N"><option value="D223N"><option value="D226N">
          <option value="D243N"><option value="D244N"><option value="D245N"><option value="D251N">
          <option value="D261N"><option value="D263N"><option value="D265N"><option value="D271N">
          <option value="D306N"><option value="D311N"><option value="D315N"><option value="D331N">
          <option value="D343N"><option value="D346N"><option value="D351N"><option value="D364N">
          <option value="D365N"><option value="D371N"><option value="D411N"><option value="D412N">
          <option value="D413N"><option value="D423N"><option value="D431N"><option value="D432N">
          <option value="D445N"><option value="D464N"><option value="D465N"><option value="D466N">
          <option value="D503N"><option value="D506N"><option value="D516N"><option value="D532N">
          <option value="D546N"><option value="D565N"><option value="D606N"><option value="D612N">
          <option value="D624N"><option value="D627N"><option value="D631N"><option value="D632N">
          <option value="D654N"><option value="D662N"><option value="D664N"><option value="D703N">
          <option value="D712N"><option value="D723N"><option value="D731N"><option value="D732N">
          <option value="D734N"><option value="D743N"><option value="D754N">
        </datalist>
        <div class="field">
          <label for="repeater-location">位置描述</label>
          <input type="text" id="repeater-location" placeholder="例 上海市浦东新区" autocomplete="off">
        </div>
        <div class="field">
          <label for="repeater-notes">备注</label>
          <textarea id="repeater-notes" rows="2" placeholder="例如：仅周末开放；覆盖市区"></textarea>
        </div>
        <div class="btn-inline-row">
          <button class="btn-small btn-apply" id="repeater-save-btn">添加</button>
          <button class="btn-small is-hidden" id="repeater-cancel-btn">取消</button>
        </div>
      </div>
    </div>

    <!-- 中继台列表 -->
    <div class="repeater-list" id="repeater-list">
      <div class="empty-state">
        <div class="empty-icon">📡</div>
        <div class="empty-text">暂无中继台</div>
      </div>
    </div>

  </div>

  <!-- 底部导航栏容器 -->
  <div id="nav-container"></div>

  <!-- Capacitor 原生插件桥接 -->
  <script type="module" src="js/vendor/capacitor-bridge.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/page-entry.js"></script>

</body>
</html>
