<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HAM Logbook - 中继台</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
</head>
<body>

  <!-- 顶部标题栏 -->
  <div class="top-bar">
    <div class="top-bar-copy"><span class="top-brand">HAM LOGBOOK</span><h1>中继台</h1></div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题">☾</button>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- 内容区 -->
  <div class="content">

    <!-- 添加/编辑中继台表单 -->
    <div class="card" id="repeater-form">
      <div class="card-header">
        <span class="card-title">中继台信息</span>
      </div>
      <div class="card-content">
        <div class="field">
          <label for="repeater-name">名称 *</label>
          <input type="text" id="repeater-name" placeholder="例如 上海 70 cm 模拟中继" autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="repeater-rx">接收频率 (MHz) *</label>
            <input type="number" id="repeater-rx" step="0.001" inputmode="decimal" placeholder="439.650" min="0">
          </div>
          <div class="field">
            <label for="repeater-tx">发射频率 (MHz) *</label>
            <input type="number" id="repeater-tx" step="0.001" inputmode="decimal" placeholder="434.650" min="0">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="repeater-tx-tone">发射亚音 <span class="optional-note">可不填</span></label>
            <input type="text" id="repeater-tx-tone" list="tone-presets" placeholder="例 88.5" autocomplete="off">
          </div>
          <div class="field">
            <label for="repeater-rx-tone">接收亚音 <span class="optional-note">可不填</span></label>
            <input type="text" id="repeater-rx-tone" list="tone-presets" placeholder="例 88.5" autocomplete="off">
          </div>
        </div>
        <datalist id="tone-presets">
          <option value="67.0"><option value="69.3"><option value="71.9"><option value="74.4">
          <option value="77.0"><option value="79.7"><option value="82.5"><option value="85.4">
          <option value="88.5"><option value="91.5"><option value="94.8"><option value="97.4">
          <option value="100.0"><option value="103.5"><option value="107.2"><option value="110.9">
          <option value="114.8"><option value="118.8"><option value="123.0"><option value="127.3">
          <option value="131.8"><option value="136.5"><option value="141.3"><option value="146.2">
          <option value="151.4"><option value="156.7"><option value="162.2"><option value="167.9">
          <option value="173.8"><option value="179.9"><option value="186.2"><option value="192.8">
          <option value="203.5"><option value="210.7"><option value="218.1"><option value="225.7">
          <option value="233.6"><option value="241.8"><option value="250.3"><option value="254.1">
          <option value="DCS023"><option value="DCS032"><option value="DCS043"><option value="DCS051">
          <option value="DCS054"><option value="DCS065"><option value="DCS071"><option value="DCS072">
          <option value="DCS073"><option value="DCS074"><option value="DCS114"><option value="DCS115">
          <option value="DCS116"><option value="DCS125"><option value="DCS131"><option value="DCS132">
          <option value="DCS134"><option value="DCS143"><option value="DCS152"><option value="DCS155">
          <option value="DCS156"><option value="DCS162"><option value="DCS165"><option value="DCS172">
          <option value="DCS174"><option value="DCS205"><option value="DCS223"><option value="DCS226">
          <option value="DCS243"><option value="DCS244"><option value="DCS245"><option value="DCS251">
          <option value="DCS261"><option value="DCS263"><option value="DCS265"><option value="DCS271">
          <option value="DCS306"><option value="DCS311"><option value="DCS315"><option value="DCS331">
          <option value="DCS343"><option value="DCS346"><option value="DCS351"><option value="DCS364">
          <option value="DCS365"><option value="DCS371"><option value="DCS411"><option value="DCS412">
          <option value="DCS413"><option value="DCS423"><option value="DCS431"><option value="DCS432">
          <option value="DCS445"><option value="DCS464"><option value="DCS465"><option value="DCS466">
          <option value="DCS503"><option value="DCS506"><option value="DCS516"><option value="DCS532">
          <option value="DCS546"><option value="DCS565"><option value="DCS606"><option value="DCS612">
          <option value="DCS624"><option value="DCS627"><option value="DCS631"><option value="DCS632">
          <option value="DCS654"><option value="DCS662"><option value="DCS664"><option value="DCS703">
          <option value="DCS712"><option value="DCS723"><option value="DCS731"><option value="DCS732">
          <option value="DCS734"><option value="DCS743"><option value="DCS754">
        </datalist>
        <div class="field">
          <label for="repeater-location">位置描述</label>
          <input type="text" id="repeater-location" placeholder="例 上海市浦东新区" autocomplete="off">
        </div>
        <div class="field">
          <label for="repeater-notes">备注</label>
          <textarea id="repeater-notes" rows="2" placeholder="例如：仅周末开放；覆盖市区"></textarea>
        </div>
        <div class="btn-inline-row">
          <button class="btn-small btn-apply" id="repeater-save-btn">添加</button>
          <button class="btn-small is-hidden" id="repeater-cancel-btn">取消</button>
        </div>
      </div>
    </div>

    <!-- 中继台列表 -->
    <div class="repeater-list" id="repeater-list">
      <div class="empty-state">
        <div class="empty-icon">📡</div>
        <div class="empty-text">暂无中继台</div>
      </div>
    </div>

  </div>

  <!-- 底部导航栏容器 -->
  <div id="nav-container"></div>

  <!-- Capacitor 原生插件桥接 -->
  <script type="module" src="js/vendor/capacitor-bridge.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module">
    import { initPage } from './js/repeater.js';
    document.addEventListener('DOMContentLoaded', initPage);
  </script>

</body>
</html>
